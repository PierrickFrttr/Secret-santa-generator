<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa</title>
<meta name="description" content="Tirage au sort de Secret Santa : un lien, chacun découvre à qui il offre un cadeau.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Outfit:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: veillée de Noël, chaleureuse et précieuse.
   IDEA: une guirlande lumineuse où pendent des étiquettes cadeau en papier kraft ; un paquet qu'on déballe.
   PICTURE: nuit étoilée, guirlande qui scintille, collines enneigées ; boîte cadeau qui s'ouvre en gerbe d'étoiles.
   COLOUR and TYPE: nuit vert sapin, rouge baie, or chaud, kraft, ivoire ; Fraunces + Outfit + Caveat (écriture à la main).
   LAYOUT: scène nocturne plein écran, carte ivoire scellée d'un nœud, une colonne centrée.
*/
:root{--night:#06201a;--night2:#0d3a2e;--ivory:#fbf6ec;--ink:#1d2a24;--muted:#6b7a71;--red:#c8202f;--red2:#8f1420;--gold:#f2c35b;--gold2:#c9902a;--kraft:#d8b083;--kraft2:#b98c5c;--line:#e8dfcf}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font:17px/1.55 Outfit,system-ui,sans-serif;overflow-x:clip;
  background:radial-gradient(120% 70% at 50% 0%,#17513f 0%,var(--night2) 35%,var(--night) 75%) fixed,var(--night)}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
.hand{font-family:Caveat,cursive;font-weight:700}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ciel */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky .st{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes tw{50%{opacity:.25}}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0)}}

/* guirlande */
.garland{position:relative;z-index:2;display:block;width:100%;height:96px;overflow:visible}
.bulb{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}

header{position:relative;z-index:1;text-align:center;padding:0 18px;margin-top:-18px}
header h1{font-size:clamp(46px,9vw,88px);color:var(--ivory);letter-spacing:-.01em}
header h1 i{color:var(--gold);font-style:italic}
header p{color:#cfe3d8;max-width:32em;margin:12px auto 0;font-size:18px}
.hills{position:relative;z-index:1;display:block;width:100%;height:max(120px,17.5vw);margin:8px 0 -3px}

main{flex:1;position:relative;z-index:2;background:#f3ede1;padding:0 max(4vw,14px) 60px}
.card{position:relative;max-width:720px;margin:0 auto;top:-70px;background:var(--ivory);border-radius:26px;padding:clamp(34px,5vw,52px) clamp(20px,5vw,52px) clamp(26px,4vw,44px);
  box-shadow:0 30px 60px -30px rgba(6,32,26,.55),0 0 0 1px rgba(185,140,92,.18);
  background-image:radial-gradient(circle at 1px 1px,rgba(185,140,92,.12) 1px,transparent 0);background-size:18px 18px}
.bow{position:absolute;left:50%;top:-34px;width:96px;height:62px;transform:translateX(-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.card h2{font-size:clamp(30px,5vw,42px);color:var(--night2);text-align:center}
.lead{color:var(--muted);text-align:center;margin:10px auto 28px;max-width:30em}

/* étapes */
.steps{display:flex;justify-content:center;gap:10px;margin:0 0 22px;padding:0;list-style:none;font-size:14px;font-weight:500;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:8px}
.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);font-size:13px}
.steps .on b{background:var(--red);color:#fff}.steps .on{color:var(--ink)}
.steps li+li::before{content:"";width:28px;height:2px;background:var(--line);margin-right:2px}

/* formulaire */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
@media(max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--night2)}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:50px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#a9b2ac}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(200,32,47,.12)}
.add{display:flex;gap:8px}
.add input{flex:1}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border-radius:14px;font-weight:700;background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red2),0 12px 24px -10px rgba(200,32,47,.6);transition:transform .1s,box-shadow .1s,background .15s}
.btn:hover{background:#d92c3b}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.btn:disabled{background:#d8d2c6;color:#8b918c;box-shadow:none;cursor:not-allowed}
.btn.green{background:var(--night2);box-shadow:0 5px 0 #062018,0 12px 24px -10px rgba(6,32,26,.6)}
.btn.green:hover{background:#13493a}
.soft{min-height:50px;padding:12px 20px;border-radius:14px;font-weight:700;background:#efe7d8;color:var(--night2)}
.soft:hover{background:#e7dcc8}
.big{width:100%;font-size:19px;min-height:60px;margin-top:26px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.err{color:var(--red);font-weight:700;font-size:14px;margin:8px 0 0;min-height:1.3em}

/* étiquettes kraft */
.tagrow{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:34px 16px;padding:26px 6px 10px;margin-top:6px;min-height:120px}
.empty{align-self:center;color:#a39d90;font-size:15px}
.tag{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:112px;min-height:58px;padding:12px 18px 10px;
  background:linear-gradient(160deg,#e3c196,var(--kraft) 55%,#cfa474);color:#3c2a17;border-radius:10px 10px 14px 14px;
  clip-path:polygon(18% 0,82% 0,100% 16%,100% 100%,0 100%,0 16%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);transform-origin:50% -26px}
.tagwrap{position:relative;display:inline-block;transform-origin:50% -16px;animation:sway 4s ease-in-out infinite}
.tagwrap:nth-child(2n){animation-delay:-1.3s}.tagwrap:nth-child(3n){animation-delay:-2.6s}
.tagwrap::before{content:"";position:absolute;left:50%;top:-16px;width:2px;height:24px;background:var(--red);transform:translateX(-50%);opacity:.7;border-radius:2px}
.tagwrap::after{content:"";position:absolute;left:50%;top:5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ivory);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);z-index:1}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.tag .hand{font-size:26px;line-height:1;margin-top:8px;overflow-wrap:anywhere;text-align:center}
.tag .x{display:grid;place-items:center;width:26px;height:26px;margin:6px -8px 0 2px;border-radius:50%;background:rgba(60,42,23,.12);color:#3c2a17;font-size:17px;line-height:1}
.tag .x:hover{background:var(--red);color:#fff}
button.tag{transition:transform .2s,filter .2s}
button.tag:hover{transform:translateY(-4px) rotate(-3deg);filter:brightness(1.06)}
button.tag:disabled{filter:grayscale(.7) opacity(.45);cursor:not-allowed;transform:none}
.tagwrap:nth-child(4n+1) .tag{background:linear-gradient(160deg,#d93a48,var(--red) 60%,#a8172a);color:#fff}
.tagwrap:nth-child(4n+3) .tag{background:linear-gradient(160deg,#1c5a47,var(--night2) 60%,#0a2c22);color:#fff}
.count{text-align:center;font-size:14px;color:var(--muted);margin-top:4px}

/* lien */
.done{text-align:center}
.seal{width:84px;height:84px;margin:0 auto 6px;display:block}
.linkbox{display:flex;gap:8px;margin-top:8px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px}
.linkbox input{border:0;min-height:46px;font-size:14px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);background:transparent}
.linkbox input:focus{box-shadow:none}
.share{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.wa{background:#1f9d55;box-shadow:0 5px 0 #13703b}.wa:hover{background:#22ad5e}
.notes{text-align:left;margin:26px 0 0;padding:18px 20px 18px 40px;background:#f5eee1;border-radius:16px;color:#55605a;font-size:15px}
.notes li{margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}

/* participant */
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:-12px 0 18px}
.pills span{background:#f8ead0;color:#7a5410;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.ask{text-align:center}
.ask .hand{font-size:clamp(52px,11vw,80px);color:var(--red);line-height:1;margin:8px 0 6px;overflow-wrap:anywhere}
.ask .row{margin-top:26px}

/* révélation */
.stage{position:relative;text-align:center;padding-top:34px}
.giftbtn{background:none;padding:0;display:block;margin:0 auto;border-radius:20px}
.gift{width:min(260px,66vw);height:auto;display:block;overflow:visible}
.giftbtn:not(.opened) .gift{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}89%{transform:rotate(-2deg)}}
.lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,1.5,.4,1)}
.opened .lid{transform:translate(14px,-38px) rotate(12deg)}
.tap{margin:14px 0 0;color:var(--muted);font-weight:500}
.burst{position:absolute;left:50%;top:150px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:10px;height:10px;border-radius:2px;opacity:0}
.go .burst i{animation:pop 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes pop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.result{opacity:0;transform:translateY(16px) scale(.96);transition:opacity .6s .45s,transform .6s .45s;pointer-events:none}
.go .result{opacity:1;transform:none;pointer-events:auto}
.go .tap{display:none}
.result p{margin:0}
.result .hello{color:var(--muted);font-weight:500;margin-top:6px}
.bigtag{display:inline-block;margin:18px auto 10px;padding:26px 44px 18px;max-width:100%;
  background:linear-gradient(160deg,#e3c196,var(--kraft) 55%,#cfa474);color:var(--red2);border-radius:12px 12px 18px 18px;
  clip-path:polygon(16% 0,84% 0,100% 18%,100% 100%,0 100%,0 18%);transform:rotate(-2deg)}
.bigtag .hand{font-size:clamp(52px,12vw,88px);line-height:1;overflow-wrap:anywhere}
.secret{font-size:15px;color:var(--muted);margin-top:16px}
footer{text-align:center;font-size:14px;color:var(--muted);margin-top:-36px}
footer button{background:none;color:var(--night2);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 8px}
@media(max-width:520px){.steps li span{display:none}.tagrow{gap:26px 10px}.tag{min-width:96px}.tag .hand{font-size:23px}}
@media(prefers-reduced-motion:reduce){.flake,.st,.bulb,.tagwrap,.gift{animation:none!important}.lid,.result{transition:none}}

/* ---- organisateur & états ---- */
.card.wide{max-width:920px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:6px}
.toolbar h2{text-align:left}
.toolbar .row{margin:0}
.mini{min-height:40px;padding:8px 14px;font-size:15px;border-radius:12px}
.panel,.draw{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,26px);margin-top:18px}
.panel h3,.draw h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;line-height:1.1;margin:0;color:var(--night2);overflow-wrap:anywhere}
.drawhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-start}
.drawhead .pills{justify-content:flex-start;margin:8px 0 0}
.prog{min-width:180px;flex:0 1 240px}
.prog p{margin:0 0 6px;font-weight:700;font-size:15px;color:var(--night2);text-align:right}
.bar{height:10px;background:#efe7d8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
.people{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.people li{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:#faf6ee;min-height:52px}
.people .nm{font-weight:700;overflow-wrap:anywhere}
.people li .mini{min-height:36px;padding:6px 10px;font-size:13px;flex:none}
.people small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.people .done small{color:#1f7a4d}
.people .done .nm::before{content:"✓ ";color:#1f7a4d}
.link-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:stretch}
.link-row .linkbox{flex:1 1 320px;margin:0}
.link-row .btn{min-height:58px}
.foot-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:16px;align-items:center}
.ghost{background:none;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:6px 8px}
.ghost:hover{color:var(--red)}
.ask-inline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;color:var(--red2)}
.slugline{font-size:14px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
.slugline b{color:var(--night2)}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-weight:500}
.loading::before{content:"";display:block;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:4px solid #efe7d8;border-top-color:var(--red);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note-box{background:#f5eee1;border-radius:16px;padding:14px 18px;color:#55605a;font-size:15px;margin-top:18px}
.err-box{background:#fde8ea;color:var(--red2);border-radius:14px;padding:12px 16px;font-weight:700;margin-top:14px}
.login{max-width:420px;margin:0 auto}
.login .btn{width:100%;margin-top:16px}
.login label{margin-top:14px}
.empty-state{text-align:center;padding:30px 10px 10px;color:var(--muted)}
.taken-note{display:block;font-family:Outfit,system-ui,sans-serif;font-size:12px;font-weight:700;margin-top:2px;opacity:.9}
@media(max-width:600px){.toolbar h2{width:100%;text-align:center}.toolbar .row{width:100%;justify-content:center}.prog{flex-basis:100%}.prog p{text-align:left}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<svg class="garland" aria-hidden="true" id="garland"></svg>

<header>
  <h1>Secret <i>Santa</i></h1>
  <p id="sub">Une liste de prénoms, un lien court à partager : chacun découvre en secret à qui il offre un cadeau.</p>
</header>

<svg class="hills" viewBox="0 0 1200 210" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <g id="fir"><path d="M0-86 L26-44 H14 L34-12 H18 L40 16 H-40 L-18-12 H-34 L-14-44 H-26Z" fill="#0b4433"/><path d="M0-86 L26-44 H14 L34-12 H18 L40 16 H6Z" fill="#0f563f"/><path d="M-26-44 L-14-44 L0-60Z M-34-12 L-18-12 L0-28Z" fill="#fff" opacity=".85"/><rect x="-5" y="16" width="10" height="12" fill="#3b2818"/></g>
    <g id="house"><rect x="-30" y="-34" width="60" height="44" fill="#4a2a1d"/><path d="M-40-32 L0-66 L40-32Z" fill="#f3ede1"/><rect x="-18" y="-20" width="14" height="14" rx="2" fill="#f2c35b"/><rect x="6" y="-20" width="12" height="30" fill="#2a160d"/></g>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset=".3" stop-color="#fff6d8" stop-opacity=".5"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="1010" cy="62" r="56" fill="url(#moon)"/><circle cx="1010" cy="62" r="24" fill="#fff4d2"/><circle cx="1019" cy="56" r="20" fill="#e9dcb4" opacity=".35"/>
  <path d="M0 150 Q180 92 380 130 T780 118 T1200 112 V210 H0Z" fill="#bfd3c8"/>
  <use href="#fir" x="90" y="128"/><use href="#fir" x="150" y="138" transform="translate(150 138) scale(.8) translate(-150 -138)"/>
  <use href="#house" x="330" y="128"/><use href="#fir" x="420" y="126"/><use href="#fir" x="880" y="114"/><use href="#fir" x="930" y="122"/>
  <path d="M0 178 Q260 140 560 172 T1200 160 V210 H0Z" fill="#f3ede1"/>
  <use href="#fir" x="40" y="176"/><use href="#fir" x="300" y="170"/><use href="#fir" x="1080" y="166"/><use href="#fir" x="1150" y="174"/>
</svg>

<main>
  <div class="card">
    <svg class="bow" viewBox="0 0 96 62" aria-hidden="true">
      <path d="M48 30 C30 4 4 6 10 24 C14 38 36 36 48 30Z" fill="#c8202f"/><path d="M48 30 C66 4 92 6 86 24 C82 38 60 36 48 30Z" fill="#c8202f"/>
      <path d="M48 30 C36 22 18 16 16 24 C22 30 38 32 48 30Z M48 30 C60 22 78 16 80 24 C74 30 58 32 48 30Z" fill="#8f1420" opacity=".5"/>
      <path d="M44 32 L30 60 L38 56 L42 62 L48 34Z M52 32 L66 60 L58 56 L54 62 L48 34Z" fill="#a8172a"/>
      <circle cx="48" cy="30" r="9" fill="#e23a48"/>
    </svg>
    <div id="app" aria-live="polite"></div>
  </div>
  <footer id="foot"></footer>
</main>

<script>
{
const API = 'https://script.google.com/macros/s/AKfycbx4bNPRGJQ-YUghsLQ1pFR1GnQNcqA2OmflAcAU5kJOA4QhFtrylOmCkS0yPDzWsYkQZg/exec';
const app = document.getElementById('app'), foot = document.getElementById('foot'), sub = document.getElementById('sub');
const card = document.querySelector('.card');
const SUB = 'Une liste de prénoms, un lien court à partager : chacun découvre en secret à qui il offre un cadeau.';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = n => {const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n};

/* ---------- adresses ---------- */
const onGH = location.hostname.endsWith('github.io');
const ROOT = (() => { const p = location.pathname.split('/').filter(Boolean); return onGH && p.length ? '/' + p[0] + '/' : '/'; })();
const local = location.protocol === 'file:';
function route(){
  const q = new URLSearchParams(location.search);
  if (q.get('t')) return {slug: q.get('t')};
  if (q.has('admin')) return {admin: true};
  if (location.hash.length > 20) return {legacy: location.hash.slice(1)};
  if (local) return {home: true};
  const rest = location.pathname.slice(ROOT.length).split('/').filter(Boolean)[0] || '';
  if (!rest || rest === 'index.html' || rest === '404.html') return {home: true};
  if (rest === 'admin') return {admin: true};
  return {slug: decodeURIComponent(rest).toLowerCase()};
}
function go(path){
  const url = local ? (path === 'admin' ? '?admin' : path ? '?t=' + path : location.pathname) : ROOT + path;
  history.pushState(null, '', url); render(); window.scrollTo({top: 0});
}
const linkFor = id => local ? location.href.split('?')[0] + '?t=' + id : location.origin + ROOT + id;
window.addEventListener('popstate', () => render());

/* ---------- serveur ---------- */
async function api(action, data = {}){
  const r = await fetch(API, {method: 'POST', body: JSON.stringify({action, ...data})});
  if (!r.ok) throw new Error('net');
  return r.json();
}
const loading = txt => { app.innerHTML = `<div class="loading">${esc(txt || 'Chargement…')}</div>`; };
const fail = (txt, retry) => {
  app.innerHTML = `<h2>Oups</h2><p class="lead">${esc(txt)}</p>${retry ? '<div class="row"><button class="btn" id="rt" type="button">Réessayer</button></div>' : ''}`;
  if (retry) app.querySelector('#rt').onclick = retry;
};

/* ---------- anciens liens (tirage dans le lien) ---------- */
const A62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
function stream(seed){let k = seed >>> 0 || 1; return () => {k ^= k << 13; k ^= k >>> 17; k ^= k << 5; return (k >>> 0) & 255}}
function decode(code){
  if (!/^s[0-9a-zA-Z]+$/.test(code)) return null;
  let n = 0n; for (const c of code.slice(1)) n = n * 62n + BigInt(A62.indexOf(c));
  const bytes = []; while (n > 0n) { bytes.unshift(Number(n % 256n)); n /= 256n; }
  if (bytes[0] !== 1 || bytes.length < 4) return null;
  const ks = stream((bytes[1] << 8 | bytes[2]) * 2654435761);
  try { const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bytes.slice(3), b => b ^ ks()))); return Array.isArray(o.n) && Array.isArray(o.c) && o.n.length === o.c.length ? o : null; } catch (e) { return null; }
}
function legacy(code){
  const o = decode(code);
  if (!o) { sub.textContent = SUB; return fail('Ce lien semble incomplet.'); }
  card.classList.remove('wide'); foot.innerHTML = '';
  sub.textContent = o.t || 'Un tirage vous attend sous le sapin.';
  const key = 'ss:me:' + code, raw = store.get(key), pills = pillsOf({budget: o.b, date: o.d});
  if (raw !== null && o.n[+raw] !== undefined) return reveal(o.n[+raw], o.n[o.c[+raw]], pills, false);
  const d = {id: code, names: o.n, claimed: [], budget: o.b, date: o.d};
  app.innerHTML = `<h2>Qui es-tu ?</h2><p class="lead">Touche ton prénom. Une seule identification par personne.</p>${pills ? `<div class="pills">${pills}</div>` : ''}<div class="tagrow">${o.n.map((n, i) => `<span class="tagwrap"><button class="tag" type="button" data-i="${i}"><span class="hand">${esc(n)}</span></button></span>`).join('')}</div>`;
  app.querySelector('.tagrow').onclick = e => {
    const b = e.target.closest('.tag'); if (!b) return; const i = +b.dataset.i;
    app.innerHTML = `<div class="ask"><p class="lead" style="margin-bottom:0">Tu confirmes être</p><p class="hand">${esc(o.n[i])} ?</p><div class="row"><button class="soft" id="no" type="button">Non, retour</button><button class="btn" id="yes" type="button">Oui, c’est moi</button></div></div>`;
    app.querySelector('#no').onclick = () => legacy(code);
    app.querySelector('#yes').onclick = () => { store.set(key, String(i)); reveal(o.n[i], o.n[o.c[i]], pills, true); };
  };
}

    for (let i = 0; i < n; i++) {
      const x0 = i * seg, x1 = x0 + seg, cx = x0 + seg / 2, cy = top + sag * 2;
      s += `<path d="M${x0} ${top} Q${cx} ${cy} ${x1} ${top}" fill="none" stroke="#0a2c22" stroke-width="2.5"/>`;
      const per = seg < 260 ? 4 : 6;
      for (let j = 0; j < per; j++, k++) {
        const t = (j + .5) / per, u = 1 - t;
        const x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * top + 2 * u * t * cy + t * t * top;
        const c = cols[k % 5];
        s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-3.5" y="-1" width="7" height="7" rx="1.5" fill="#24342d"/><ellipse class="bulb" cx="0" cy="14" rx="6" ry="9" fill="${c}" style="animation-delay:-${(k * .37 % 2.4).toFixed(2)}s;filter:drop-shadow(0 0 6px ${c})"/></g>`;
      }
    }
    g.innerHTML = s;
  };
  drawG();
  const gro = new ResizeObserver(drawG); gro.observe(g);
  const sky = document.getElementById('sky');
  let h = '';
  for (let k = 0; k < 60; k++) h += `<i class="st" style="left:${Math.random() * 100}%;top:${Math.random() * 45}%;opacity:${(.3 + Math.random() * .6).toFixed(2)};animation-delay:-${(Math.random() * 3).toFixed(1)}s"></i>`;
  if (!reduced) for (let k = 0; k < 50; k++) { const z = 2 + Math.random() * 5; h += `<i class="flake" style="left:${(Math.random() * 100).toFixed(1)}%;width:${z.toFixed(1)}px;height:${z.toFixed(1)}px;--dx:${(Math.random() * 90 - 45).toFixed(0)}px;opacity:${(.35 + Math.random() * .55).toFixed(2)};animation-duration:${(9 + Math.random() * 12).toFixed(1)}s;animation-delay:-${(Math.random() * 20).toFixed(1)}s"></i>`; }
  sky.innerHTML = h;
}
}
</script>
</body>
</html>
